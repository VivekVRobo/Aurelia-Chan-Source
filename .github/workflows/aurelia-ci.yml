name: Aurelia CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  stabilized-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Compile package
        run: python -m compileall -q aurelia
      - name: Lint stabilized files
        run: |
          ruff check \
            aurelia/character/persona_renderer.py \
            aurelia/cognition/planner.py \
            aurelia/embodiment/__init__.py \
            aurelia/embodiment/adapter.py \
            aurelia/embodiment/contracts.py \
            aurelia/execution/dag_executor.py \
            aurelia/execution/executor.py \
            aurelia/persistence/database.py \
            aurelia/runtime/api_contract.py \
            aurelia/runtime/app_bootstrap.py \
            aurelia/runtime/capability_catalog.py \
            aurelia/runtime/capability_handlers.py \
            aurelia/runtime/cognitive_runtime.py \
            aurelia/runtime/dag_verification.py \
            aurelia/runtime/grounding.py \
            aurelia/runtime/health.py \
            aurelia/runtime/persistence.py \
            test_dag_execution.py \
            test_embodiment_contract.py \
            test_integration_hardening.py \
            test_persistence_runtime.py \
            test_persona_runtime.py \
            test_runtime_stabilization.py \
            test_v4_phase10_integration.py
          ruff format --check \
            aurelia/character/persona_renderer.py \
            aurelia/cognition/planner.py \
            aurelia/embodiment/__init__.py \
            aurelia/embodiment/adapter.py \
            aurelia/embodiment/contracts.py \
            aurelia/execution/dag_executor.py \
            aurelia/execution/executor.py \
            aurelia/persistence/database.py \
            aurelia/runtime/api_contract.py \
            aurelia/runtime/app_bootstrap.py \
            aurelia/runtime/capability_catalog.py \
            aurelia/runtime/capability_handlers.py \
            aurelia/runtime/cognitive_runtime.py \
            aurelia/runtime/dag_verification.py \
            aurelia/runtime/grounding.py \
            aurelia/runtime/health.py \
            aurelia/runtime/persistence.py \
            test_dag_execution.py \
            test_embodiment_contract.py \
            test_integration_hardening.py \
            test_persistence_runtime.py \
            test_persona_runtime.py \
            test_runtime_stabilization.py \
            test_v4_phase10_integration.py
      - name: Runtime stabilization regression tests
        run: |
          python -m unittest -v \
            test_runtime_stabilization \
            test_dag_execution \
            test_persistence_runtime \
            test_persona_runtime \
            test_integration_hardening \
            test_embodiment_contract

  cognitive-os-v4-v6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run V4 V5 V6 master suite
        run: python test_all_cognitive_os.py

  legacy-v3-phases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run original phase suites
        run: |
          pytest -q \
            test_phase1_contracts.py \
            test_phase2_knowledge.py \
            test_phase2_specialists.py \
            test_phase3_routing.py \
            test_phase4_memory.py \
            test_phase5_planning.py \
            test_phase6_verification.py \
            test_phase7_llm.py \
            test_phase8_character.py \
            test_phase9_higher_cognition.py \
            test_phase10_learning.py \
            test_phase11_evaluation.py \
            test_phase12_runtime.py
